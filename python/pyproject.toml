[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-injector"
version = "0.1.0"
description = "Lightweight chaos experiment engine (Python edition) distilled from an industrial four-layer chaos engineering platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["chaos-engineering", "fault-injection", "resilience-testing", "gaussdb", "high-availability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
chaos-injector = "chaos_injector.chaos:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chaos_injector*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
