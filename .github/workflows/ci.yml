name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: python
        run: ruff check src tests
      - name: Test
        working-directory: python
        run: pytest -q

  go:
    name: Go (vet + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Test
        working-directory: go
        run: go test ./... -count=1
      - name: Build
        working-directory: go
        run: go build ./...
